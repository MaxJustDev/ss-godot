name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdtoolkit
        run: pip install 'gdtoolkit>=4.3'

      - name: Lint
        run: gdlint addons/ tests/

      - name: Format check
        run: gdformat --check addons/ tests/

  test:
    name: GUT unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install GUT plugin
        run: |
          mkdir -p addons/gut
          curl -L https://github.com/bitwes/Gut/archive/refs/heads/release.tar.gz | tar xz --strip-components=1 -C addons/gut

      - name: Run GUT
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit
